<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080c1a"/>
    </linearGradient>

    <!-- Wave 1 Gradient (Electric Indigo to Cyan) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7952ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#4cd7f6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Wave 2 Gradient (Cyber Cyan to Purple) -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientCyan" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#4cd7f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4cd7f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientPurple" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#4cd7f6" fill-opacity="0.15"/>
    </pattern>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px); opacity: 0.95; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      @keyframes badgeGlow {
        0%, 100% { fill-opacity: 0.15; stroke-opacity: 0.3; }
        50% { fill-opacity: 0.3; stroke-opacity: 0.7; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 2px;
        fill: #c0c1ff;
      }
      .badge-text {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #4cd7f6;
      }
      .animated-container {
        animation: floatPulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient Glows -->
  <rect width="1200" height="260" rx="16" fill="url(#ambientCyan)"/>
  <rect width="1200" height="260" rx="16" fill="url(#ambientPurple)"/>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="258" rx="15" fill="none" stroke="#4cd7f6" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Decorative Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#4cd7f6" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M 1180 40 L 1180 20 L 1160 20" fill="none" stroke="#4cd7f6" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M 20 220 L 20 240 L 40 240" fill="none" stroke="#7952ff" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M 1180 220 L 1180 240 L 1160 240" fill="none" stroke="#7952ff" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Animated Dynamic Waves at Bottom -->
  <!-- Wave Layer 2 (Back) -->
  <path fill="url(#waveGrad2)">
    <animate
      attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      values="
        M0 260 L0 185 Q 300 225 600 180 T 1200 195 L 1200 260 Z;
        M0 260 L0 200 Q 300 170 600 205 T 1200 180 L 1200 260 Z;
        M0 260 L0 180 Q 300 210 600 175 T 1200 200 L 1200 260 Z;
        M0 260 L0 185 Q 300 225 600 180 T 1200 195 L 1200 260 Z"
    />
  </path>

  <!-- Wave Layer 1 (Front Glowing) -->
  <path fill="url(#waveGrad1)">
    <animate
      attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
        M0 260 L0 215 Q 300 175 600 215 T 1200 210 L 1200 260 Z;
        M0 260 L0 200 Q 300 225 600 190 T 1200 225 L 1200 260 Z;
        M0 260 L0 220 Q 300 185 600 220 T 1200 205 L 1200 260 Z;
        M0 260 L0 215 Q 300 175 600 215 T 1200 210 L 1200 260 Z"
    />
  </path>

  <!-- Decorative Top Status Badge -->
  <g transform="translate(600, 48)">
    <!-- Pill Container -->
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0b1329" stroke="#4cd7f6" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Pulsing Green Online Indicator -->
    <circle cx="-116" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Badge Label -->
    <text x="10" y="4" text-anchor="middle" class="badge-text">STATUS: MAKE IT POSSIBLE</text>
  </g>

  <!-- Central Brand & Content -->
  <g class="animated-container">
    <!-- Main Title with subtle glow -->
    <text x="600" y="125" text-anchor="middle" class="title-text" filter="url(#glow)">Ridho Tawang</text>
    <text x="600" y="125" text-anchor="middle" class="title-text">Ridho Tawang</text>

    <!-- Subtitle / Roles -->
    <text x="600" y="165" text-anchor="middle" class="subtitle-text">FULL-STACK WEB • FLUTTER MOBILE • SYSTEMS &amp; SECURITY</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="380" y1="182" x2="820" y2="182" stroke="#4cd7f6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>
</svg>
